[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "appliance-admin"
version = "0.1.0"
description = "Secure local privileged administration daemon and FastAPI bridge for Linux appliances"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Bespoke Engineering"}]
dependencies = [
  "dbus-next>=0.2.3,<0.3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "PyJWT>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.6,<1", "mypy>=1.10,<2"]

[project.scripts]
appliance-admin-daemon = "appliance_admin.daemon.main:main"
appliance-admin-web = "appliance_admin.web.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/appliance_admin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
